<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tihatan関連のさまざまなリンクです</title>
    
    <style>
        /* ページ全体の基本設定 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: linear-gradient(135deg, #1f1c2c 0%, #000000 100%);
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* リンクをまとめる枠 */
        .container {
            width: 100%;
            max-width: 450px;
        }

        /* 一番上のタイトル */
        h1 {
            color: #ffd700;
            text-align: center;
            font-size: 1.6em;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        /* 各リンクのボタン（カード風） */
        .link-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 15px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .link-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 15px;
        }

        .link-text {
            font-weight: bold;
            font-size: 1.1em;
            line-height: 1.4;
        }

        .nenkin-text {
            color: #fa8072;
            font-size: 1.1em;
            text-shadow: 0 1px 5px rgba(250, 128, 114, 0.3);
        }
        
        .nenkin-sub {
            font-size: 0.7em;
            color: #ccc;
            font-weight: normal;
        }

        /* ほしいものリスト専用ボタン */
        .amazon-btn {
            display: block;
            text-align: center;
            background: linear-gradient(to right, #ff9900, #ffb84d);
            color: #111;
            font-weight: bold;
            font-size: 1.1em;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .amazon-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        /* ニコニコの埋め込み枠 */
        .iframe-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 16px;
        }
        
        .iframe-wrapper iframe {
            border-radius: 8px;
            max-width: 100%;
        }

        /* ▼ 追加：画面を白く発光させるためのレイヤー ▼ */
        #white-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            pointer-events: none; /* クリック操作を邪魔しないようにする */
            opacity: 0; /* 初期状態は透明 */
            z-index: 9999; /* 一番手前に表示 */
            transition: opacity 0.3s ease-in; /* ふんわり光るアニメーション */
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tihatan関連のさまざまなリンクです</h1>

        <a href="https://misskey.io/@tihatan_" class="link-card">
            <img src="https://github.com/Tihatan/Tihatan.github.io/assets/133956936/a37eb738-37b3-4676-8878-64bc101a0cfd" alt="Misskey用アイコン">
            <div class="link-text">Misskey.io【Tihatan_】</div>
        </a>

        <a href="https://twitter.com/tihatan_" class="link-card">
            <img src="https://github.com/Tihatan/Tihatan.github.io/assets/133956936/1d8d629d-7bb6-44c9-a958-51991cb657c4" alt="Twitter用アイコン">
            <div class="link-text">Twitter【Tihatan_】</div>
        </a>

        <div class="iframe-wrapper">
            <iframe width="320" height="160" src="https://ext.nicovideo.jp/thumb_user/55482857" scrolling="no" style="border:solid 1px #CCC;" frameborder="0">チハたん</iframe>
        </div>

        <a href="https://www.amazon.jp/hz/wishlist/ls/26922EUVWX7QQ?ref_=wl_share" target="_blank" class="amazon-btn">
            📦 ほしいものリストです
        </a>

        <a href="https://Tihatan.github.io/nenkin%20sim.html" class="link-card">
            <div class="link-text nenkin-text">
                年金追納額シミュレーター<br>
                <span class="nenkin-sub">(個人利用)</span>
            </div>
        </a>
    </div>

    <div id="white-flash"></div>

    <script>
        const konamiCode = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
        let inputKeys = [];
        const flashLayer = document.getElementById('white-flash');

        // 正解数（進捗）に応じた画面の白さ（不透明度 0.0〜1.0）
        // 0〜4キー目（上下上下）までは透明(0)。以降、加速度的に白くなる。
        const flashOpacities = {
            0: 0, 1: 0.02, 2: 0.04, 3: 0.08, 4: 0.12,   // 上・上・下・下
            5: 0.18, // 左
            6: 0.25, // 右
            7: 0.35, // 左
            8: 0.60, // 右
            9: 0.85, // B
            10: 1.0  // A（完全に真っ白）
        };

        document.addEventListener('keydown', function(e) {
            inputKeys.push(e.key.toLowerCase());
            if (inputKeys.length > konamiCode.length) {
                inputKeys.shift();
            }
            
            // 現在の入力履歴が、コナミコマンドの先頭から「何文字目まで連続で正解しているか」を判定
            let progress = 0;
            for (let i = 0; i <= inputKeys.length; i++) {
                let suffix = inputKeys.slice(inputKeys.length - i);
                let prefix = konamiCode.slice(0, i);
                if (suffix.join('') === prefix.join('')) {
                    progress = i;
                }
            }

            // 進捗に合わせて画面の白さを変更
            flashLayer.style.opacity = flashOpacities[progress];

            // コマンドが完全に一致（10文字正解）した場合
            if (progress === 10) {
                // 画面が完全に真っ白になる演出を見せるため、0.5秒(500ミリ秒)だけ遅らせてジャンプする
                setTimeout(function() {
                    const randomValue = Math.random();
                    if (randomValue < 0.1) {
                        window.location.href = 'https://www.youtube.com/watch?v=fC7oUOUEEi4';
                    } else {
                        window.location.href = 'https://youtu.be/dQw4w9WgXcQ?si=dE2LkEpmktROqo34';
                    }
                    inputKeys = []; // リセット
                    flashLayer.style.opacity = 0; // 白発光もリセット
                }, 500);
            }
        });
    </script>
</body>
</html>
