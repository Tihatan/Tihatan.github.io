<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国民年金 追納額シミュレーター（令和8年度 追納版）</title>
    <style>
        .tsuinou-calc-wrapper { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f7f9fc; color: #333; line-height: 1.6; padding: 20px; box-sizing: border-box; }
        .tsuinou-calc-container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tsuinou-calc-container h2 { font-size: 1.4em; text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px; }
        .tsuinou-calc-container .subtitle { display: block; font-size: 0.65em; color: #666; font-weight: normal; margin-top: 5px; }
        .tsuinou-calc-group { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #eee; }
        .tsuinou-calc-group:last-of-type { border-bottom: none; }
        .tsuinou-calc-container label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        .tsuinou-calc-container select, .tsuinou-calc-container input { padding: 12px 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1em; background-color: #fff; }
        .tsuinou-calc-flex { display: flex; gap: 10px; align-items: center; }
        .tsuinou-calc-flex > select.gengo { flex: 1; min-width: 70px; }
        .tsuinou-calc-flex > input.year { flex: 1.5; min-width: 60px; }
        .tsuinou-calc-flex > select.month { flex: 1.5; min-width: 70px; }
        .tsuinou-calc-unit { font-size: 0.9em; color: #666; font-weight: bold; white-space: nowrap; }
        .tsuinou-calc-container button { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s; appearance: none; -webkit-appearance: none; }
        .tsuinou-calc-container button:hover { background-color: #2980b9; }
        .tsuinou-calc-result { margin-top: 25px; display: none; }
        .tsuinou-calc-duration { text-align: center; font-size: 1.1em; font-weight: bold; color: #2c3e50; margin-bottom: 15px; background: #eee; padding: 12px; border-radius: 5px; }
        .tsuinou-calc-item { background: #e8f4fd; border-left: 5px solid #3498db; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .tsuinou-calc-item h3 { margin: 0 0 5px 0; font-size: 1.05em; color: #2980b9; }
        .tsuinou-calc-item .amount { font-size: 1.6em; font-weight: bold; color: #e74c3c; }
        .tsuinou-calc-note { font-size: 0.85em; color: #7f8c8d; margin-top: 15px; }
        .tsuinou-calc-credit { text-align: center; margin-top: 25px; font-size: 0.85em; color: #95a5a6; }
    </style>
</head>
<body>

<div class="tsuinou-calc-wrapper">
    <div class="tsuinou-calc-container">
        <h2>年金追納額シミュレーター<span class="subtitle">（令和8年度 追納時確定金額対応）</span></h2>
        
        <div class="tsuinou-calc-group">
            <label>特例開始年月（20歳到達月など）</label>
            <div class="tsuinou-calc-flex">
                <select id="calc-start-gengo" class="gengo">
                    <option value="R">令和</option>
                    <option value="H" selected>平成</option>
                </select>
                <input type="number" id="calc-start-year" class="year" value="30" min="1" max="64" placeholder="例: 30"> <span class="tsuinou-calc-unit">年</span>
                <select id="calc-start-month" class="month"></select> <span class="tsuinou-calc-unit">月</span>
            </div>
        </div>

        <div class="tsuinou-calc-group">
            <label>特例終了年月（卒業・特例終了月）</label>
            <div class="tsuinou-calc-flex">
                <select id="calc-end-gengo" class="gengo">
                    <option value="R" selected>令和</option>
                    <option value="H">平成</option>
                </select>
                <input type="number" id="calc-end-year" class="year" value="2" min="1" max="64" placeholder="例: 2"> <span class="tsuinou-calc-unit">年</span>
                <select id="calc-end-month" class="month"></select> <span class="tsuinou-calc-unit">月</span>
            </div>
            <div class="tsuinou-calc-note">※卒業した月（例：3月卒業なら3月）を指定してください。</div>
        </div>

        <button onclick="runTsuinouCalc()">追納額を計算する</button>

        <div id="calc-result-box" class="tsuinou-calc-result">
            <div class="tsuinou-calc-duration">
                対象期間：<span id="calc-display-duration">0</span>ヶ月
            </div>
            
            <div class="tsuinou-calc-item">
                <h3>【一括払い】（全期間分）</h3>
                <div class="amount" id="calc-total-amount">0円</div>
            </div>
            <div class="tsuinou-calc-item">
                <h3>【6ヶ月分ずつ支払う場合】（1回あたりの目安）</h3>
                <div class="amount" id="calc-six-month-amount">0円</div>
            </div>
            <div class="tsuinou-calc-item">
                <h3>【3ヶ月分ずつ支払う場合】（1回あたりの目安）</h3>
                <div class="amount" id="calc-three-month-amount">0円</div>
            </div>
            <p class="tsuinou-calc-note">※この金額は「令和8年度中」に追納する場合の正確な金額に基づいています。<br>※追納できるのは過去10年以内の免除分のみです。平成27年度以前の分は時効により追納できません。</p>
        </div>

        <div class="tsuinou-calc-credit">
            Create by Google Gemini
        </div>
    </div>
</div>

<script>
// 既存のWebサイトのCSSやJSと競合しないよう、固有のIDやクラス名を付与しています

(function() {
    const startMonthSelect = document.getElementById('calc-start-month');
    const endMonthSelect = document.getElementById('calc-end-month');
    if(startMonthSelect && endMonthSelect) {
        for(let i=1; i<=12; i++) {
            startMonthSelect.innerHTML += `<option value="${i}" ${i===4 ? 'selected' : ''}>${i}</option>`;
            endMonthSelect.innerHTML += `<option value="${i}" ${i===3 ? 'selected' : ''}>${i}</option>`;
        }
    }
})();

const tsuinouPremiumData = {
    2016: 16850, 
    2017: 17070, 
    2018: 16900, 
    2019: 16950, 
    2020: 17070, 
    2021: 17110, 
    2022: 16990, 
    2023: 16770, 
    2024: 16980, 
    2025: 17510, 
    2026: 17510  
};

function getTsuinouGregorianYear(gengo, year) {
    if (gengo === 'H') return 1988 + year;
    if (gengo === 'R') return 2018 + year;
    return year;
}

function runTsuinouCalc() {
    const startGengo = document.getElementById('calc-start-gengo').value;
    const startYearInput = parseInt(document.getElementById('calc-start-year').value);
    const startMonth = parseInt(document.getElementById('calc-start-month').value);
    
    const endGengo = document.getElementById('calc-end-gengo').value;
    const endYearInput = parseInt(document.getElementById('calc-end-year').value);
    const endMonth = parseInt(document.getElementById('calc-end-month').value);

    if (isNaN(startYearInput) || isNaN(endYearInput)) {
        alert("正しい年を入力してください。");
        return;
    }

    const startYear = getTsuinouGregorianYear(startGengo, startYearInput);
    const endYear = getTsuinouGregorianYear(endGengo, endYearInput);
    const duration = (endYear - startYear) * 12 + (endMonth - startMonth) + 1;

    if (duration <= 0) {
        alert("特例終了年月は、開始年月と同じかそれ以降の年月を指定してください。");
        return;
    }

    let currentYear = startYear;
    let currentMonth = startMonth;
    let totalPymt = 0;

    for (let i = 0; i < duration; i++) {
        let fiscalYear = currentYear;
        if (currentMonth <= 3) {
            fiscalYear -= 1;
        }

        let amount = tsuinouPremiumData[fiscalYear];
        if (!amount) {
            amount = (fiscalYear < 2016) ? 16850 : 17510; 
        }

        totalPymt += amount;
        currentMonth++;
        if (currentMonth > 12) {
            currentMonth = 1;
            currentYear++;
        }
    }

    const formatYen = (num) => new Intl.NumberFormat('ja-JP').format(num) + '円';

    document.getElementById('calc-display-duration').innerText = duration;
    document.getElementById('calc-total-amount').innerText = formatYen(totalPymt);
    
    const div6 = Math.min(duration, 6);
    const div3 = Math.min(duration, 3);
    
    document.getElementById('calc-six-month-amount').innerText = formatYen(Math.round(totalPymt / duration * div6));
    document.getElementById('calc-three-month-amount').innerText = formatYen(Math.round(totalPymt / duration * div3));
    
    document.getElementById('calc-result-box').style.display = 'block';
}
</script>
</body>
</html>
